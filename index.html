<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure and Genius in Genesis | Dr. Phil Heath</title>
    <style>
        /* Premium Core Font Infrastructure */
        @import url('https://googleapis.com');

        /* Color Palette & Tokens (Cosmic Midnight & Royal Kingdom Gold) */
        :root {
            --midnight-deep: #030712;
            --midnight-surface: #0b1329;
            --midnight-accent: #1c2541;
            --gold-burnished: #c5a059;
            --gold-bright: #e8c580;
            --gold-pale: #f3e5ab;
            --parchment-soft: #fbf8f3;
            --ink-charcoal: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--midnight-deep);
            color: var(--text-light);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .brand-logo {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.05em;
        }

        /* Global Structural Utilities */
        .container {
            width: 90%;
            max-width: 1140px;
            margin: 0 auto;
            padding: 100px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .accent-divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold-burnished), transparent);
            margin: 0 auto;
        }

        /* Fixed Navigation System */
        header {
            background-color: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: var(--transition-smooth);
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 1140px;
            margin: 0 auto;
            padding: 20px 0;
        }

        .brand-logo {
            color: var(--gold-bright);
            font-size: 1.15rem;
            font-weight: 800;
            text-decoration: none;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: var(--transition-smooth);
        }

        nav a:hover {
            color: var(--gold-bright);
        }

        /* Immersive Cosmic Hero Section */
        .hero-section {
            position: relative;
            background: radial-gradient(circle at 75% 30%, var(--midnight-accent) 0%, var(--midnight-deep) 70%);
            padding: 80px 0;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(197, 160, 89, 0.08) 1px, transparent 0);
            background-size: 32px 32px;
            pointer-events: none;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 60px;
            align-items: center;
        }

        .hero-content {
            text-align: center;
        }

        .announcement-badge {
            display: inline-block;
            border: 1px solid rgba(197, 160, 89, 0.3);
            background-color: rgba(197, 160, 89, 0.05);
            color: var(--gold-bright);
            padding: 6px 18px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            border-radius: 50px;
            margin-bottom: 30px;
        }

        .hero-content h1 {
            font-size: 2.75rem;
            line-height: 1.15;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .hero-content h1 span {
            display: block;
            color: var(--gold-bright);
            font-size: 3.5rem;
            margin-top: 8px;
        }

        .hero-tagline {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            font-style: italic;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        /* 3D Modern Book Mockup Display */
        .hero-visual {
            display: flex;
            justify-content: center;
        }

        .book-canvas {
            position: relative;
            width: 290px;
            height: 440px;
            background: linear-gradient(135deg, #0a1424 0%, #02050a 100%);
            border: 1px solid rgba(197, 160, 89, 0.35);
            border-radius: 4px 14px 14px 4px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8),
                        inset 15px 0 20px -10px rgba(255, 255, 255, 0.05);
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .book-canvas::after {
            content: '';
            position: absolute;
            top: 0;
            left: 12px;
            bottom: 0;
            width: 5px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03), transparent);
            border-right: 1px solid rgba(0, 0, 0, 0.5);
        }

        .book-canvas .meta-top {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--gold-burnished);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 30px;
        }

        .book-canvas h4 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            padding-bottom: 20px;
            width: 100%;
        }

        .book-canvas .author-bottom {
            margin-top: auto;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--gold-bright);
        }

        /* Button Architecture */
        .action-button-primary {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold-burnished) 0%, #b38944 100%);
            color: var(--midnight-deep);
            padding: 18px 40px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-decoration: none;
            border-radius: 4px;
            box-shadow: 0 10px 25px -5px rgba(197, 160, 89, 0.4);
            transition: var(--transition-smooth);
        }

        .action-button-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(197, 160, 89, 0.6);
            background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-burnished) 100%);
        }

        /* Editorial Layout (Parchment Split) */
        .editorial-section {
            background-color: var(--parchment-soft);
            color: var(--ink-charcoal);
        }

        .editorial-section .section-header h2 {
            color: var(--midnight-deep);
        }

        .editorial-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 60px;
        }

        .editorial-prose {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            line-height: 1.85;
        }

        .editorial-prose p {
            margin-bottom: 30px;
            text-align: justify;
        }

        .editorial-prose .highlight-lead {
            font-size: 1.6rem;
            color: var(--midnight-deep);
            font-weight: 600;
        }

        /* Cultural Influences Panel */
        .spheres-panel {
            background-color: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            padding: 45px;
            box-shadow: 0 25px 50px -20px rgba(0, 0, 0, 0.06);
        }

        .spheres-panel h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--midnight-deep);
            margin-bottom: 25px;
        }

        .spheres-layout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            list-style: none;
        }

        .spheres-layout-grid li {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: #475569;
            display: flex;
            align-items: center;
        }

        .spheres-layout-grid li::before {
            content: "✦";
            color: var(--gold-burnished);
            margin-right: 12px;
            font-size: 1.2rem;
        }

        /* Commercial Matrix (Purchase Grid) */
        .commerce-section {
            background-color: var(--midnight-deep);
        }
